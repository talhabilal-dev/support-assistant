<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Reply to your question</title>
	</head>
	<body style="margin: 0; padding: 0; background: #f4f4f5; font-family: Arial, Helvetica, sans-serif; color: #18181b;">
		<div style="display: none; max-height: 0; overflow: hidden;">
			The team has replied to your question.
		</div>
		<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background: #f4f4f5; padding: 24px 0;">
			<tr>
				<td align="center">
					<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width: 600px; background: #ffffff; border-radius: 12px; overflow: hidden;">
						<tr>
							<td style="background: #18181b; padding: 24px 32px;">
								<span style="color: #ffffff; font-size: 18px; font-weight: bold;">Support Assistant</span>
							</td>
						</tr>
						<tr>
							<td style="padding: 32px;">
								<h1 style="margin: 0 0 16px; font-size: 20px;">Reply to your question</h1>
								<p style="margin: 0 0 8px; line-height: 1.5;"><strong>You asked</strong></p>
								<p style="margin: 0 0 16px; line-height: 1.5; color: #52525b;">{{question}}</p>
								<p style="margin: 0 0 8px; line-height: 1.5;"><strong>Answer</strong></p>
								<p style="margin: 0; line-height: 1.5;">{{body}}</p>
								<p style="margin: 16px 0 0; color: #71717a; font-size: 12px; line-height: 1.5;">
									Ticket {{ticketId}}
								</p>
							</td>
						</tr>
						<tr>
							<td style="padding: 16px 32px; color: #71717a; font-size: 12px;">
								&copy; {{year}} Support Assistant. All rights reserved.
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
