# pnpm settings for this project.
# pnpm does not run dependency build scripts unless they are listed here, and a
# fresh install (e.g. on a deploy host) fails with ERR_PNPM_IGNORED_BUILDS when
# any were skipped. esbuild — pulled in by tsx and drizzle-kit — is the only
# dependency in this tree that needs its install script.
onlyBuiltDependencies:
  - esbuild
